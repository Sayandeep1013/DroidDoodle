org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Required by AGP whenever AndroidX artifacts are on the classpath, which for a
# Compose app is immediately. Absent, :app:checkDebugAarMetadata fails.
android.useAndroidX=true
# R classes carry only this module's resources rather than every dependency's,
# which keeps build times and method counts down.
android.nonTransitiveRClass=true
