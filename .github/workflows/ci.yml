name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters day to day. Needs no Android SDK, no NDK, no emulator
  # and no model file -- see docs/10-architecture.md §7. Everything in P0-P6 is
  # verified here.
  jvm:
    name: JVM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed: generating gradle-wrapper.jar requires a
      # local Gradle install, which constraint C2 rules out. setup-gradle
      # provisions a pinned Gradle instead, which is equivalent for CI purposes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Test core modules
        id: test
        continue-on-error: true
        env:
          # Keeps :app out of the configuration phase so this job needs no
          # Android SDK and stays fast. See settings.gradle.kts.
          DD_SKIP_ANDROID: '1'
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :core-model:test \
            :core-world:test \
            :core-grammar:test \
            :inference:test \
            :core-agent:test \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Publishes compiler diagnostics to a `ci-logs` branch, readable over raw
      # HTTPS without authentication.
      #
      # The development machine has no JDK, Gradle or Kotlin compiler
      # (constraint C2) and no working `gh`, so CI is the only type-checker in
      # the loop -- and the Actions logs API requires auth even for a public
      # repo. Without this, every compile error costs a manual copy-paste round
      # trip. Files are named per run so they are never served stale from cache.
      - name: Publish build diagnostics
        if: always()
        run: |
          set -e
          OUT="$RUNNER_TEMP/logout"
          rm -rf "$OUT" && mkdir -p "$OUT"

          grep -nE '^e: |^w: |error:|FAILED|FAILURE:|Caused by:|Execution failed|^> Task .*(FAILED|failed)' \
            "$RUNNER_TEMP/build.log" | head -500 > "$OUT/diagnostics-${{ github.run_number }}.txt" || true
          # Gradle prints the actual cause in a "What went wrong" block near the
          # TOP of the log; --stacktrace then buries it under hundreds of frames,
          # so a plain tail shows nothing useful.
          sed -n '/^\* What went wrong:/,/^\* Get more help/p' "$RUNNER_TEMP/build.log" \
            | head -60 > "$OUT/cause-${{ github.run_number }}.txt" || true
          grep -v $'\t at \\|^\tat ' "$RUNNER_TEMP/build.log" | tail -n 120 \
            > "$OUT/tail-${{ github.run_number }}.txt" || true
          printf 'run=%s sha=%s outcome=%s\n' \
            "${{ github.run_number }}" "${{ github.sha }}" "${{ steps.test.outcome }}" \
            > "$OUT/status-${{ github.run_number }}.txt"

          cd "$OUT"
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "diagnostics for ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # continue-on-error above keeps the diagnostics step reachable; the job
      # must still fail so a red build is not mistaken for a green one.
      - name: Fail the job if the tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # Slower, and deliberately not a prerequisite for the jvm job: core logic
  # failures should report in a couple of minutes rather than waiting behind an
  # Android build. docs/10-architecture.md §7.
  android:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 \
            | tee "$RUNNER_TEMP/android.log"

      - name: Publish Android diagnostics
        if: always()
        run: |
          set -e
          OUT="$RUNNER_TEMP/androidout"
          rm -rf "$OUT" && mkdir -p "$OUT"
          grep -nE '^e: |^w: |error:|FAILED|FAILURE:|Caused by:|Execution failed' \
            "$RUNNER_TEMP/android.log" | head -500 \
            > "$OUT/android-diagnostics-${{ github.run_number }}.txt" || true
          sed -n '/^\* What went wrong:/,/^\* Get more help/p' "$RUNNER_TEMP/android.log" \
            | head -60 > "$OUT/android-cause-${{ github.run_number }}.txt" || true
          grep -v $'\t at \\|^\tat ' "$RUNNER_TEMP/android.log" | tail -n 120 \
            > "$OUT/android-tail-${{ github.run_number }}.txt" || true
          cd "$OUT"
          git init -q -b android-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "android diagnostics ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            android-logs

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: droiddoodle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Fail the job if the build failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1
