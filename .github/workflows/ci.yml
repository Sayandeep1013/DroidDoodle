name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters day to day. Needs no Android SDK, no NDK, no emulator
  # and no model file -- see docs/10-architecture.md §7. Everything in P0-P6 is
  # verified here.
  jvm:
    name: JVM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed: generating gradle-wrapper.jar requires a
      # local Gradle install, which constraint C2 rules out. setup-gradle
      # provisions a pinned Gradle instead, which is equivalent for CI purposes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Test core modules
        id: test
        continue-on-error: true
        env:
          # Keeps :app out of the configuration phase so this job needs no
          # Android SDK and stays fast. See settings.gradle.kts.
          DD_SKIP_ANDROID: '1'
        run: |
          set -o pipefail
          # `build` rather than an enumerated task list: it compiles main and
          # test and runs `check` for every included project, so a new module
          # is covered the day it is added instead of the day someone
          # remembers to add it here. :prompt-suite was nearly missed exactly
          # that way.
          gradle --no-daemon --stacktrace --continue build \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Publishes compiler diagnostics to a `ci-logs` branch, readable over raw
      # HTTPS without authentication.
      #
      # The development machine has no JDK, Gradle or Kotlin compiler
      # (constraint C2) and no working `gh`, so CI is the only type-checker in
      # the loop -- and the Actions logs API requires auth even for a public
      # repo. Without this, every compile error costs a manual copy-paste round
      # trip. Files are named per run so they are never served stale from cache.
      - name: Publish build diagnostics
        if: always()
        run: |
          set -e
          OUT="$RUNNER_TEMP/logout"
          rm -rf "$OUT" && mkdir -p "$OUT"

          grep -nE '^e: |^w: |error:|FAILED|FAILURE:|Caused by:|Execution failed|^> Task .*(FAILED|failed)' \
            "$RUNNER_TEMP/build.log" | head -500 > "$OUT/diagnostics-${{ github.run_number }}.txt" || true
          # Gradle prints the actual cause in a "What went wrong" block near the
          # TOP of the log; --stacktrace then buries it under hundreds of frames,
          # so a plain tail shows nothing useful.
          sed -n '/^\* What went wrong:/,/^\* Get more help/p' "$RUNNER_TEMP/build.log" \
            | head -60 > "$OUT/cause-${{ github.run_number }}.txt" || true
          grep -v $'\t at \\|^\tat ' "$RUNNER_TEMP/build.log" | tail -n 120 \
            > "$OUT/tail-${{ github.run_number }}.txt" || true
          printf 'run=%s sha=%s outcome=%s\n' \
            "${{ github.run_number }}" "${{ github.sha }}" "${{ steps.test.outcome }}" \
            > "$OUT/status-${{ github.run_number }}.txt"

          cd "$OUT"
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "diagnostics for ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # continue-on-error above keeps the diagnostics step reachable; the job
      # must still fail so a red build is not mistaken for a green one.
      - name: Fail the job if the tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # Slower, and deliberately not a prerequisite for the jvm job: core logic
  # failures should report in a couple of minutes rather than waiting behind an
  # Android build. docs/10-architecture.md §7.
  android:
    name: Debug APK
    runs-on: ubuntu-latest
    # Cross-compiling ggml for arm64 from scratch dominates this job. The cache
    # below makes repeat runs far cheaper, but a cold one is slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # :inference-llama builds llama.cpp from the pinned submodule, so a
          # bare checkout would fail at CMake configure with an empty directory.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install NDK and CMake
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "cmake;3.22.1" > /dev/null
          # Use whatever NDK the image ships rather than pinning a version the
          # runner may not have; the exact patch level does not matter to us.
          NDK_VERSION="$(basename "$ANDROID_NDK_LATEST_HOME")"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "using NDK $NDK_VERSION"

      # A signing key that survives between builds, created once and reused.
      #
      # Without this, AGP generates a fresh debug keystore on each runner, so
      # every APK is signed with a different key. Android then refuses to
      # install a build over its predecessor, and the only way in is to
      # uninstall -- which deletes filesDir and the downloaded model with it.
      # The symptom is having to re-download several hundred megabytes after
      # every update, which is exactly what happened.
      #
      # It lives on an orphan branch rather than in the tree so it is not part
      # of the source history. It is a development key with a published
      # password; it exists to keep the signature stable, not to protect
      # anything.
      - name: Fetch or create the development signing key
        run: |
          set -e
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          KEYDIR="$RUNNER_TEMP/signing"
          mkdir -p "$KEYDIR"
          if git ls-remote --exit-code --heads "$REMOTE" signing >/dev/null 2>&1; then
            git clone -q --depth 1 --branch signing "$REMOTE" "$RUNNER_TEMP/signing-repo"
            cp "$RUNNER_TEMP/signing-repo/droiddoodle-dev.jks" "$KEYDIR/"
            echo "reusing the existing signing key"
          else
            keytool -genkeypair -v \
              -keystore "$KEYDIR/droiddoodle-dev.jks" \
              -alias droiddoodle -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass droiddoodle -keypass droiddoodle \
              -dname "CN=DroidDoodle Development, OU=CI, O=DroidDoodle, C=GB"
            (
              cd "$KEYDIR"
              git init -q -b signing
              git add -A
              git -c user.name=ci -c user.email=ci@local \
                commit -qm "development signing key, created once and reused"
              git push -q "$REMOTE" signing
            )
            echo "created a new signing key -- builds from here on can update in place"
          fi
          keytool -list -keystore "$KEYDIR/droiddoodle-dev.jks" -storepass droiddoodle \
            | grep -i "SHA1\|Certificate fingerprint" || true
          echo "DD_KEYSTORE=$KEYDIR/droiddoodle-dev.jks" >> "$GITHUB_ENV"

      # The native build is the expensive part and its inputs change rarely --
      # the llama.cpp revision is pinned, so a hit is the normal case.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            inference-llama/.cxx
            inference-llama/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('.gitmodules', 'inference-llama/src/main/cpp/CMakeLists.txt', 'inference-llama/build.gradle.kts') }}

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          # --continue so a native build failure does not hide the Kotlin
          # errors. compileDebugKotlin does not depend on buildCMakeDebug, and
          # with no local compiler (constraint C2) every hidden error costs a
          # full CI round trip to discover.
          # assembleRelease as well as debug: release builds package and shrink
          # differently, and a release-only failure discovered later is a
          # failure discovered at the worst possible moment.
          #
          # lintDebug is the closest thing to a device this loop has. It is the
          # only check that catches calling an API above minSdk, which under
          # constraint C2 would otherwise surface as a crash on the user's
          # phone. It does not gate the build; the report is published to read.
          gradle --no-daemon --stacktrace --continue \
            "-Pdd.ndkVersion=$NDK_VERSION" \
            "-Pdd.keystore=$DD_KEYSTORE" \
            :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 \
            | tee "$RUNNER_TEMP/android.log"

      # "The APK assembles with the native library" is a P8 acceptance criterion,
      # and a successful build does not establish it -- a wrong abiFilter or a
      # missing asset directory both produce a green build and a broken APK. So
      # look inside. continue-on-error keeps the diagnostics push reachable.
      - name: Inspect the APK
        id: inspect
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          {
            echo "apk=$APK"
            echo "bytes=$(stat -c%s "$APK")"
            echo "--- native libraries and assets ---"
            unzip -l "$APK" | grep -E 'lib/|assets/' || echo "NONE FOUND"
          } > "$RUNNER_TEMP/apk-contents.txt"
          cat "$RUNNER_TEMP/apk-contents.txt"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdroiddoodle_llama.so' \
            || { echo "the native library is missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/models.json' \
            || { echo "the model manifest is missing from the APK"; exit 1; }

      - name: Publish Android diagnostics
        if: always()
        run: |
          set -e
          OUT="$RUNNER_TEMP/androidout"
          rm -rf "$OUT" && mkdir -p "$OUT"
          if [ -f "$RUNNER_TEMP/apk-contents.txt" ]; then
            cp "$RUNNER_TEMP/apk-contents.txt" "$OUT/apk-contents-${{ github.run_number }}.txt"
          fi
          # Lint's own report, which carries the API-level findings the build
          # log only summarises.
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            head -300 app/build/reports/lint-results-debug.txt \
              > "$OUT/lint-${{ github.run_number }}.txt"
          fi
          # CMake and ninja report in their own dialects, so the native build
          # needs patterns the Kotlin-only jvm job does not.
          grep -nE '^e: |^w: |error:|FAILED|FAILURE:|Caused by:|Execution failed|CMake Error|ninja: |undefined reference|No such file or directory' \
            "$RUNNER_TEMP/android.log" | head -500 \
            > "$OUT/android-diagnostics-${{ github.run_number }}.txt" || true
          sed -n '/^\* What went wrong:/,/^\* Get more help/p' "$RUNNER_TEMP/android.log" \
            | head -60 > "$OUT/android-cause-${{ github.run_number }}.txt" || true
          grep -v $'\t at \\|^\tat ' "$RUNNER_TEMP/android.log" | tail -n 120 \
            > "$OUT/android-tail-${{ github.run_number }}.txt" || true
          cd "$OUT"
          git init -q -b android-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "android diagnostics ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            android-logs

      # Actions artifacts need an authenticated download, and the development
      # machine has no working `gh` (constraint C2's neighbour). A prerelease
      # asset has a stable, unauthenticated URL, which is the only way an APK
      # reaches a phone from here.
      # A full release, not a prerelease: a prerelease is hidden from the repo's
      # "Latest" badge and from /releases/latest, which made the APK look
      # missing when it was attached all along.
      - name: Publish the APKs to the latest release
        if: steps.inspect.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" DroidDoodle.apk
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" DroidDoodle-debug.apk

          cat > notes.md <<'NOTES'
          **[⬇ Download DroidDoodle.apk](https://github.com/Sayandeep1013/DroidDoodle/releases/latest/download/DroidDoodle.apk)**

          Rebuilt automatically from every green commit on `main`.

          - `DroidDoodle.apk` — the release build. Install this one.
          - `DroidDoodle-debug.apk` — same app, plus the debug-only option to
            skip the model picker and drive a scripted engine.

          **arm64-v8a only**, so it needs a real phone; a standard x86_64
          emulator will refuse to install it. No model is bundled — the app
          downloads one on first run and then never touches the network again.

          Signed with the Android debug key, so Android will warn about an
          unknown developer. That is expected for a build that is not going
          through Play.
          NOTES
          printf '\nBuilt from %s\n' "${{ github.sha }}" >> notes.md

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest DroidDoodle.apk DroidDoodle-debug.apk \
            --title "DroidDoodle — latest build" \
            --notes-file notes.md
          # The old prerelease tag would otherwise sit above this one in the
          # list, still labelled "Latest debug build".
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: droiddoodle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Fail the job if the build or the APK check failed
        if: steps.assemble.outcome == 'failure' || steps.inspect.outcome == 'failure'
        run: exit 1
