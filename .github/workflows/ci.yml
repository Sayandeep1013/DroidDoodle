name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters day to day. Needs no Android SDK, no NDK, no emulator
  # and no model file -- see docs/10-architecture.md §7. Everything in P0-P6 is
  # verified here.
  jvm:
    name: JVM core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed: generating gradle-wrapper.jar requires a
      # local Gradle install, which constraint C2 rules out. setup-gradle
      # provisions a pinned Gradle instead, which is equivalent for CI purposes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Test core modules
        run: >
          gradle --no-daemon --stacktrace
          :core-model:test
          :core-world:test
          :core-grammar:test
          :inference:test
          :core-agent:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
